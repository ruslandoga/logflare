name: Elixir CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches: ["**"]
    paths:
      - ".tool-versions"
      - "Cargo.toml"
      - "VERSION"
      - ".reach.baseline.json"
      - "lib/**"
      - "lints/**"
      - "config/**"
      - "*.exs"
      - "*.lock"
      - "Dockerfile.base"
      - "Dockerfile.runner"
      - "Dockerfile.multi-step"
      - "docs/docs.logflare.com/docs/**"
      - "native/**"
      - "priv/**"
      - "test/**"
      - "!test/e2e/supabase/**"
      - ".github/workflows/elixir-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  SHELL: /bin/bash

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read Rust version
        id: rust
        run: echo "version=$(awk '$1 == "rust" {print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.rust.outputs.version }}

      - name: Cache Dialyzer PLT
        uses: actions/cache@v5
        with:
          path: dialyzer
          key: plt-${{ runner.os }}-${{ runner.arch }}-${{ env.MIX_ENV }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}-${{ hashFiles('mix.exs') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ runner.arch }}-${{ env.MIX_ENV }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}-
            plt-${{ runner.os }}-${{ runner.arch }}-${{ env.MIX_ENV }}-${{ hashFiles('.tool-versions') }}-

      - name: Cache Mix build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
            priv/native
          key: mix-${{ runner.os }}-${{ runner.arch }}-${{ env.MIX_ENV }}-unit-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock', 'Cargo.lock') }}-${{ hashFiles('mix.exs', 'VERSION', 'Cargo.toml', 'config/**', 'lib/**', 'native/**', 'priv/**', 'test/support/**', 'docs/docs.logflare.com/docs/**') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ runner.arch }}-${{ env.MIX_ENV }}-unit-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock', 'Cargo.lock') }}-
            mix-${{ runner.os }}-${{ runner.arch }}-${{ env.MIX_ENV }}-unit-${{ hashFiles('.tool-versions') }}-

      - name: Cache Cargo build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tool-versions') }}-elixir-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'native/**', '!native/**/target/**') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tool-versions') }}-elixir-${{ hashFiles('Cargo.lock') }}-
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tool-versions') }}-elixir-

      - name: Prepare in-app docs
        run: |
          rm -rf priv/docs
          cp -R docs/docs.logflare.com/docs priv/docs

      - name: Install dependencies
        run: mix 'do' deps.get + deps.loadpaths

      - name: Run CI checks
        run: mix ci

      - name: Check types
        run: mix test.typings

      - name: Check dependency advisories
        run: mix test.deps
        continue-on-error: true

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: bitnamilegacy/postgresql:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: logflare_test
          POSTGRESQL_WAL_LEVEL: logical
        options: >-
          --health-cmd "pg_isready -d logflare_test -U postgres -p 5432"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:26.2
        ports:
          - 8123:8123
          - 9000:9000
        env:
          CLICKHOUSE_DB: logflare_test
          CLICKHOUSE_USER: logflare
          CLICKHOUSE_PASSWORD: logflare
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --memory="1500m"
          --memory-reservation="512m"
          --cpus="1.0"
          --shm-size="256m"
          --tmpfs /var/lib/clickhouse:rw,size=1G
    steps:
      - uses: actions/checkout@v6

      - name: Read Rust version
        id: rust
        run: echo "version=$(awk '$1 == "rust" {print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.rust.outputs.version }}

      - name: Cache Mix build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
            priv/native
          key: mix-${{ runner.os }}-${{ runner.arch }}-${{ env.MIX_ENV }}-unit-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock', 'Cargo.lock') }}-${{ hashFiles('mix.exs', 'VERSION', 'Cargo.toml', 'config/**', 'lib/**', 'native/**', 'priv/**', 'test/support/**', 'docs/docs.logflare.com/docs/**') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ runner.arch }}-${{ env.MIX_ENV }}-unit-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock', 'Cargo.lock') }}-
            mix-${{ runner.os }}-${{ runner.arch }}-${{ env.MIX_ENV }}-unit-${{ hashFiles('.tool-versions') }}-

      - name: Cache Cargo build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tool-versions') }}-elixir-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'native/**', '!native/**/target/**') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tool-versions') }}-elixir-${{ hashFiles('Cargo.lock') }}-
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tool-versions') }}-elixir-

      - name: Prepare in-app docs
        run: |
          rm -rf priv/docs
          cp -R docs/docs.logflare.com/docs priv/docs

      - name: Prepare Telegraf output
        run: |
          mkdir -p db/telegraf_output
          touch db/telegraf_output/metrics.out
          chmod 666 db/telegraf_output/metrics.out

      - name: Start Telegraf
        run: docker compose up -d telegraf

      - name: Install dependencies
        run: mix 'do' deps.get + deps.loadpaths

      - name: Compile application
        run: mix compile

      - name: Set up test database
        run: mix 'do' ecto.create --no-compile + ecto.migrate --no-compile

      - name: Start Erlang port mapper
        run: epmd -daemon

      - name: Run tests
        run: mix test.coverage.ci

      - name: Upload coverage
        uses: coverallsapp/github-action@v2
        with:
          file: cover/lcov.info
          format: lcov
          git-commit: ${{ github.event.pull_request.head.sha || github.sha }}
          build-number: ${{ github.run_id }}-${{ github.run_attempt }}
