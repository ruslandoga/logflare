name: Incremental Dialyzer probe
on:
  workflow_dispatch:
    inputs:
      extended:
        description: Run changed-input and cached-warning scenarios after baseline parity
        type: boolean
        default: false
      warm_only:
        description: Restore the original IPLT and compare one warm analysis to its artifact
        type: boolean
        default: false
      retention_only:
        description: Finish the existing cached-error/repeat/fix scenario without classic reruns
        type: boolean
        default: false
      reference_iplt_key:
        description: Exact original IPLT cache key corresponding to the reference artifact
        type: string
        default: 'iplt-probe-v1-Linux-X64-27.3.4.6-1.19.5-otp-27-test-f6feff6c0a7b932db9ad61f6d97fd0466e32b3843765ca3c1ca061d50b6a7026-876d9b208f8feffce3ef7e56266f68c943987dc0f6e724f1428dd62a66766ea9'
      reference_run:
        description: Prior diagnostic run containing the original incremental baseline
        type: string
        default: '34510108645'
permissions:
  contents: read
  actions: read
concurrency:
  group: incremental-dialyzer-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  typing:
    name: ${{ inputs.warm_only && 'Restored incremental Dialyzer' || inputs.retention_only && 'Incremental warning retention' || 'Classic versus incremental Dialyzer' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      MIX_ENV: test
      SHELL: /bin/bash
    steps:
      - uses: actions/checkout@v6
      - name: Validate diagnostic mode
        if: ${{ inputs.warm_only && inputs.retention_only }}
        run: exit 1
      - name: Read versions
        id: v
        run: |
          echo "elixir=$(awk '$1 == "elixir" {print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "erlang=$(awk '$1 == "erlang" {print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "rust=$(awk '$1 == "rust" {print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.v.outputs.rust }}

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo
            target
          key: cargo-v2-${{ runner.os }}-${{ steps.v.outputs.rust }}-elixir-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'native/**') }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-${{ steps.v.outputs.rust }}-elixir-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}-
            cargo-v2-${{ runner.os }}-${{ steps.v.outputs.rust }}-elixir-${{ github.job }}-

      - name: Restore Mix cache
        id: mix-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            deps
            _build
            priv/native
          key: mix-v5-${{ runner.os }}-${{ steps.v.outputs.erlang }}-${{ steps.v.outputs.elixir }}-${{ github.job }}-${{ hashFiles('mix.lock', '**/Cargo.lock') }}-${{ hashFiles('mix.exs', 'Cargo.toml', 'config/**', 'lib/**', 'native/**', 'priv/**', 'test/support/**') }}
          restore-keys: |
            mix-v5-${{ runner.os }}-${{ steps.v.outputs.erlang }}-${{ steps.v.outputs.elixir }}-${{ github.job }}-${{ hashFiles('mix.lock', '**/Cargo.lock') }}-
            mix-v5-${{ runner.os }}-${{ steps.v.outputs.erlang }}-${{ steps.v.outputs.elixir }}-${{ github.job }}-

      - name: Prepare in-app docs
        run: |
          rm -rf priv/docs
          cp -R docs/docs.logflare.com/docs priv/docs

      - name: Restore Dialyzer PLT cache
        id: plt-cache
        uses: actions/cache/restore@v5
        with:
          path: dialyzer
          key: plt-${{ runner.os }}-${{ steps.v.outputs.erlang }}-${{ steps.v.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ steps.v.outputs.erlang }}-${{ steps.v.outputs.elixir }}-
            plt-${{ runner.os }}-${{ steps.v.outputs.erlang }}-

      - name: Install dependencies
        id: dependencies
        run: mix do deps.get + deps.loadpaths


      - name: Compile application
        run: mix test.compile
      - name: Save compiled Mix cache
        if: steps.mix-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            deps
            _build
            priv/native
          key: ${{ steps.mix-cache.outputs.cache-primary-key }}
      - name: Prepare classic PLT
        if: ${{ !inputs.warm_only && !inputs.retention_only }}
        run: mix dialyzer --plt --no-compile
      - name: Save prepared classic PLT
        if: ${{ !inputs.warm_only && !inputs.retention_only && steps.plt-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: dialyzer
          key: ${{ steps.plt-cache.outputs.cache-primary-key }}
      - name: Restore incremental PLT
        if: ${{ !inputs.warm_only && !inputs.retention_only }}
        id: iplt-cache
        uses: actions/cache/restore@v5
        with:
          path: dialyzer-incremental
          key: iplt-probe-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.v.outputs.erlang }}-${{ steps.v.outputs.elixir }}-test-${{ hashFiles('mix.lock', 'mix.exs', '.github/scripts/dialyzer_probe*.exs') }}-${{ hashFiles('lib/**', 'test/support/**', 'config/**', 'VERSION') }}
          restore-keys: |
            iplt-probe-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.v.outputs.erlang }}-${{ steps.v.outputs.elixir }}-test-
      - name: Restore original incremental PLT
        if: ${{ inputs.warm_only || inputs.retention_only }}
        uses: actions/cache/restore@v5
        with:
          path: dialyzer-incremental
          key: ${{ inputs.reference_iplt_key }}
          fail-on-cache-miss: true
      - name: Stock Dialyxir reference
        if: ${{ !inputs.warm_only && !inputs.retention_only }}
        run: mix run --no-start --no-compile .github/scripts/dialyzer_probe_stock.exs
      - name: Classic baseline
        if: ${{ !inputs.warm_only && !inputs.retention_only }}
        run: mix run --no-start --no-compile .github/scripts/dialyzer_probe.exs classic baseline-classic
      - name: Incremental initial analysis
        if: ${{ !inputs.warm_only && !inputs.retention_only }}
        run: mix run --no-start --no-compile .github/scripts/dialyzer_probe.exs incremental baseline-incremental
      - name: Save successfully analyzed incremental PLT
        if: ${{ !inputs.warm_only && !inputs.retention_only && steps.iplt-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: dialyzer-incremental
          key: ${{ steps.iplt-cache.outputs.cache-primary-key }}
      - name: Record initial diagnostic parity
        if: ${{ !inputs.warm_only && !inputs.retention_only }}
        run: |
          if ! elixir .github/scripts/dialyzer_probe_compare.exs baseline-classic baseline-incremental; then
            touch dialyzer-probe-results/raw-parity-mismatch
          fi
          elixir .github/scripts/dialyzer_probe_deltas.exs baseline-classic baseline-incremental
      - name: Incremental unchanged analysis
        if: ${{ !inputs.warm_only && !inputs.retention_only }}
        run: mix run --no-start --no-compile .github/scripts/dialyzer_probe.exs incremental unchanged-incremental
      - name: Compare unchanged diagnostic parity
        if: ${{ !inputs.warm_only && !inputs.retention_only }}
        run: elixir .github/scripts/dialyzer_probe_compare.exs baseline-incremental unchanged-incremental
      - name: Compare changed inputs and retained warnings
        if: ${{ inputs.extended && !inputs.warm_only && !inputs.retention_only }}
        run: .github/scripts/dialyzer_probe_scenarios.sh
      - name: Download original diagnostic baseline
        if: ${{ inputs.warm_only || inputs.retention_only }}
        uses: actions/download-artifact@v4
        with:
          name: dialyzer-probe-${{ inputs.reference_run }}-1
          path: dialyzer-probe-reference
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.reference_run }}
      - name: Analyze restored incremental PLT
        if: inputs.warm_only
        run: |
          test -s dialyzer-incremental/logflare.iplt
          mix run --no-start --no-compile .github/scripts/dialyzer_probe.exs incremental restored-incremental
      - name: Compare restored IPLT diagnostics
        if: inputs.warm_only
        run: |
          cp dialyzer-probe-reference/baseline-incremental.* dialyzer-probe-results/
          elixir .github/scripts/dialyzer_probe_compare.exs baseline-incremental restored-incremental
      - name: Finish cached warning retention and fixes
        if: inputs.retention_only
        run: .github/scripts/dialyzer_probe_retention.sh
      - name: Measure cache sizes
        if: always()
        run: du -sh dialyzer dialyzer-incremental || true
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dialyzer-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: dialyzer-probe-results
          retention-days: 14
      - name: Require exact raw diagnostic parity
        if: ${{ !inputs.warm_only && !inputs.retention_only }}
        run: test ! -e dialyzer-probe-results/raw-parity-mismatch
