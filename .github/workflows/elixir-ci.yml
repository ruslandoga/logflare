name: Elixir CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches: ["**"]
    paths:
      - ".tool-versions"
      - "Cargo.toml"
      - "VERSION"
      - "assets/**"
      - "lib/**"
      - "config/**"
      - "*.exs"
      - "*.lock"
      - "Dockerfile.base"
      - "Dockerfile.runner"
      - "Dockerfile.multi-step"
      - "docs/docs.logflare.com/docs/**"
      - "native/**"
      - "priv/**"
      - "test/**"
      - "!test/e2e/supabase/**"
      - ".github/scripts/**"
      # Run suite when this file is changed
      - ".github/workflows/elixir-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Get versions
    runs-on: ubuntu-latest
    outputs:
      elixir: ${{ steps.v.outputs.elixir }}
      erlang: ${{ steps.v.outputs.erlang }}
      rust: ${{ steps.v.outputs.rust }}
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      quality: ${{ steps.changes.outputs.quality }}
      static: ${{ steps.changes.outputs.static }}
      rust_changed: ${{ steps.changes.outputs.rust }}
      mix_deps_hash: ${{ steps.v.outputs.mix_deps_hash }}
      mix_source_hash: ${{ steps.v.outputs.mix_source_hash }}
      cargo_lock_hash: ${{ steps.v.outputs.cargo_lock_hash }}
      cargo_source_hash: ${{ steps.v.outputs.cargo_source_hash }}
      mapper_source_hash: ${{ steps.v.outputs.mapper_source_hash }}
      plt_lock_hash: ${{ steps.v.outputs.plt_lock_hash }}
      plt_config_hash: ${{ steps.v.outputs.plt_config_hash }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read versions and cache inputs
        id: v
        env:
          MIX_DEPS_HASH: ${{ hashFiles('mix.lock', '**/Cargo.lock') }}
          MIX_SOURCE_HASH: ${{ hashFiles('mix.exs', 'VERSION', 'Cargo.toml', 'config/**', 'lib/**', 'native/**', 'priv/**', 'test/support/**') }}
          CARGO_LOCK_HASH: ${{ hashFiles('**/Cargo.lock') }}
          CARGO_SOURCE_HASH: ${{ hashFiles('Cargo.toml', 'native/**') }}
          MAPPER_SOURCE_HASH: ${{ hashFiles('Cargo.toml', 'native/mapper_ex/**') }}
          PLT_LOCK_HASH: ${{ hashFiles('mix.lock') }}
          PLT_CONFIG_HASH: ${{ hashFiles('mix.exs') }}
        run: |
          echo "elixir=$(grep '^elixir '  .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "erlang=$(grep '^erlang '  .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "rust=$(grep   '^rust '    .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "mix_deps_hash=$MIX_DEPS_HASH" >> "$GITHUB_OUTPUT"
          echo "mix_source_hash=$MIX_SOURCE_HASH" >> "$GITHUB_OUTPUT"
          echo "cargo_lock_hash=$CARGO_LOCK_HASH" >> "$GITHUB_OUTPUT"
          echo "cargo_source_hash=$CARGO_SOURCE_HASH" >> "$GITHUB_OUTPUT"
          echo "mapper_source_hash=$MAPPER_SOURCE_HASH" >> "$GITHUB_OUTPUT"
          echo "plt_lock_hash=$PLT_LOCK_HASH" >> "$GITHUB_OUTPUT"
          echo "plt_config_hash=$PLT_CONFIG_HASH" >> "$GITHUB_OUTPUT"

      - name: Detect affected checks
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/elixir_ci_changes.sh

  typing:
    name: Static checks
    runs-on: ubuntu-latest
    needs: versions
    if: needs.versions.outputs.quality == 'true'
    env:
      MIX_ENV: test
      SHELL: /bin/bash
    steps:
      - uses: actions/checkout@v6

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install Rust
        if: needs.versions.outputs.static == 'true'
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ needs.versions.outputs.rust }}

      - name: Restore Cargo cache
        if: needs.versions.outputs.static == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo
            target
          key: cargo-v2-${{ runner.os }}-${{ needs.versions.outputs.rust }}-elixir-${{ github.job }}-${{ needs.versions.outputs.cargo_lock_hash }}-${{ needs.versions.outputs.cargo_source_hash }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-${{ needs.versions.outputs.rust }}-elixir-${{ github.job }}-${{ needs.versions.outputs.cargo_lock_hash }}-
            cargo-v2-${{ runner.os }}-${{ needs.versions.outputs.rust }}-elixir-${{ github.job }}-

      - name: Restore Mix cache
        id: mix_cache
        uses: actions/cache/restore@v5
        with:
          path: |
            deps
            _build
            priv/native
          key: mix-v6-${{ runner.os }}-${{ runner.arch }}-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-${{ needs.versions.outputs.rust }}-${{ env.MIX_ENV }}-${{ needs.versions.outputs.mix_deps_hash }}-${{ needs.versions.outputs.mix_source_hash }}
          restore-keys: |
            mix-v6-${{ runner.os }}-${{ runner.arch }}-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-${{ needs.versions.outputs.rust }}-${{ env.MIX_ENV }}-${{ needs.versions.outputs.mix_deps_hash }}-
            mix-v6-${{ runner.os }}-${{ runner.arch }}-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-${{ needs.versions.outputs.rust }}-${{ env.MIX_ENV }}-

      # Seed v6 from the verified main build while main still publishes v5 caches.
      - name: Restore compatible legacy Mix cache
        if: >-
          steps.mix_cache.outputs.cache-matched-key == '' &&
          runner.os == 'Linux' && runner.arch == 'X64' && env.MIX_ENV == 'test' &&
          needs.versions.outputs.erlang == '27.3.4.6' &&
          needs.versions.outputs.elixir == '1.19.5-otp-27' &&
          needs.versions.outputs.rust == '1.96.0'
        uses: actions/cache/restore@v5
        with:
          path: |
            deps
            _build
            priv/native
          key: mix-v5-Linux-27.3.4.6-1.19.5-otp-27-compile-9a6949383b1e545017858bd4dc2194eed1da26cb845044dc091c72d0099cd9db-dfcedfe5946a1f01fa3eb6b59df3d657b90b908529d661c3443d2925aaebb6f9

      - name: Prepare in-app docs
        if: needs.versions.outputs.static == 'true'
        run: |
          rm -rf priv/docs
          cp -R docs/docs.logflare.com/docs priv/docs

      - name: Restore Dialyzer PLT cache
        id: plt_cache
        if: needs.versions.outputs.static == 'true'
        uses: actions/cache/restore@v5
        with:
          path: dialyzer
          key: plt-v2-${{ runner.os }}-${{ runner.arch }}-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-${{ env.MIX_ENV }}-${{ needs.versions.outputs.plt_lock_hash }}-${{ needs.versions.outputs.plt_config_hash }}
          restore-keys: |
            plt-v2-${{ runner.os }}-${{ runner.arch }}-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-${{ env.MIX_ENV }}-${{ needs.versions.outputs.plt_lock_hash }}-
            plt-v2-${{ runner.os }}-${{ runner.arch }}-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-${{ env.MIX_ENV }}-
            plt-${{ runner.os }}-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-

      - name: Install dependencies
        id: dependencies
        run: mix do deps.get + deps.loadpaths

      - name: Check change detection
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: .github/scripts/test_elixir_ci_changes.sh

      - name: Check formatting
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: mix test.format

      - name: Compile with warnings as errors
        id: compile
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && needs.versions.outputs.static == 'true' }}
        run: mix test.compile

      - name: Save compiled Mix cache
        if: ${{ !cancelled() && steps.compile.outcome == 'success' && steps.mix_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            deps
            _build
            priv/native
          key: ${{ steps.mix_cache.outputs.cache-primary-key }}

      - name: Check lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: mix lint.all

      - name: Check types
        id: types
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        env:
          LEGACY_PLT_CACHE: ${{ startsWith(steps.plt_cache.outputs.cache-matched-key, 'plt-') && !startsWith(steps.plt_cache.outputs.cache-matched-key, 'plt-v2-') }}
        run: |
          if [[ "$LEGACY_PLT_CACHE" == "true" ]]; then
            mix test.typings --force-check
          else
            mix test.typings
          fi

      - name: Save Dialyzer PLT cache
        if: ${{ !cancelled() && steps.types.outcome == 'success' && steps.plt_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: dialyzer
          key: ${{ steps.plt_cache.outputs.cache-primary-key }}

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: versions
    if: needs.versions.outputs.backend == 'true'
    services:
      postgres:
        image: bitnamilegacy/postgresql:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: logflare_test
          POSTGRESQL_WAL_LEVEL: logical
        options: >-
          --health-cmd "pg_isready -d logflare_test -U postgres -p 5432"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:26.2
        ports:
          - 8123:8123
          - 9000:9000
        env:
          CLICKHOUSE_DB: logflare_test
          CLICKHOUSE_USER: logflare
          CLICKHOUSE_PASSWORD: logflare
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --memory="1500m"
          --memory-reservation="512m"
          --cpus="1.0"
          --shm-size="256m"
          --tmpfs /var/lib/clickhouse:rw,size=1G
          --tmpfs /var/log/clickhouse-server:rw,size=100M
    env:
      MIX_ENV: test
      SHELL: /bin/bash
    steps:
      - uses: actions/checkout@v6

      - name: Prepare Telegraf Output Dir
        run: |
          mkdir -p db/telegraf_output
          touch db/telegraf_output/metrics.out
          chmod 666 db/telegraf_output/metrics.out

      - name: Start Telegraf
        run: docker compose up -d telegraf

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ needs.versions.outputs.rust }}

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo
            target
          key: cargo-v2-${{ runner.os }}-${{ needs.versions.outputs.rust }}-elixir-${{ github.job }}-${{ needs.versions.outputs.cargo_lock_hash }}-${{ needs.versions.outputs.cargo_source_hash }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-${{ needs.versions.outputs.rust }}-elixir-${{ github.job }}-${{ needs.versions.outputs.cargo_lock_hash }}-
            cargo-v2-${{ runner.os }}-${{ needs.versions.outputs.rust }}-elixir-${{ github.job }}-

      - name: Restore Mix cache
        id: mix_cache
        uses: actions/cache/restore@v5
        with:
          path: |
            deps
            _build
            priv/native
          key: mix-v6-${{ runner.os }}-${{ runner.arch }}-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-${{ needs.versions.outputs.rust }}-${{ env.MIX_ENV }}-${{ needs.versions.outputs.mix_deps_hash }}-${{ needs.versions.outputs.mix_source_hash }}
          restore-keys: |
            mix-v6-${{ runner.os }}-${{ runner.arch }}-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-${{ needs.versions.outputs.rust }}-${{ env.MIX_ENV }}-${{ needs.versions.outputs.mix_deps_hash }}-
            mix-v6-${{ runner.os }}-${{ runner.arch }}-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-${{ needs.versions.outputs.rust }}-${{ env.MIX_ENV }}-

      # Seed v6 from the verified main build while main still publishes v5 caches.
      - name: Restore compatible legacy Mix cache
        if: >-
          steps.mix_cache.outputs.cache-matched-key == '' &&
          runner.os == 'Linux' && runner.arch == 'X64' && env.MIX_ENV == 'test' &&
          needs.versions.outputs.erlang == '27.3.4.6' &&
          needs.versions.outputs.elixir == '1.19.5-otp-27' &&
          needs.versions.outputs.rust == '1.96.0'
        uses: actions/cache/restore@v5
        with:
          path: |
            deps
            _build
            priv/native
          key: mix-v5-Linux-27.3.4.6-1.19.5-otp-27-compile-9a6949383b1e545017858bd4dc2194eed1da26cb845044dc091c72d0099cd9db-dfcedfe5946a1f01fa3eb6b59df3d657b90b908529d661c3443d2925aaebb6f9

      - name: Prepare in-app docs
        run: |
          rm -rf priv/docs
          cp -R docs/docs.logflare.com/docs priv/docs

      - name: Install dependencies
        run: mix do deps.get + deps.loadpaths

      - name: Compile application
        id: compile
        run: mix compile

      - name: Save compiled Mix cache
        if: ${{ !cancelled() && steps.compile.outcome == 'success' && steps.mix_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            deps
            _build
            priv/native
          key: ${{ steps.mix_cache.outputs.cache-primary-key }}

      - name: Set up test database
        run: |
          epmd -daemon
          mix do ecto.create --no-compile + ecto.migrate --no-compile

      - name: Run tests
        run: mix test.coverage.ci

      - name: Upload coverage
        uses: coverallsapp/github-action@v2
        with:
          file: cover/lcov.info
          format: lcov
          git-commit: ${{ github.event.pull_request.head.sha || github.sha }}
          build-number: ${{ github.run_id }}-${{ github.run_attempt }}

  rust:
    name: Rust unit tests
    runs-on: ubuntu-latest
    needs: versions
    if: needs.versions.outputs.rust_changed == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ needs.versions.outputs.rust }}

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo
            target
          key: cargo-v2-${{ runner.os }}-${{ needs.versions.outputs.rust }}-rust-unit-${{ needs.versions.outputs.cargo_lock_hash }}-${{ needs.versions.outputs.mapper_source_hash }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-${{ needs.versions.outputs.rust }}-rust-unit-${{ needs.versions.outputs.cargo_lock_hash }}-
            cargo-v2-${{ runner.os }}-${{ needs.versions.outputs.rust }}-rust-unit-

      - name: Run mapper Rust unit tests
        run: cargo test -p mapper_ex

  frontend:
    name: Frontend JavaScript Unit Tests (assets)
    runs-on: ubuntu-latest
    needs: versions
    if: needs.versions.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix assets

      - name: Run frontend JavaScript unit tests
        run: npm test --prefix assets
