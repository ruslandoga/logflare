name: Rust CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".tool-versions"
      - "Cargo.toml"
      - "Cargo.lock"
      - "native/mapper_ex/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    branches: ["**"]
    paths:
      - ".tool-versions"
      - "Cargo.toml"
      - "Cargo.lock"
      - "native/mapper_ex/**"
      - ".github/workflows/rust-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read Rust version
        id: rust
        run: echo "version=$(awk '$1 == "rust" {print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.rust.outputs.version }}

      - name: Cache Cargo build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tool-versions') }}-rust-unit-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'native/**', '!native/**/target/**') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tool-versions') }}-rust-unit-${{ hashFiles('Cargo.lock') }}-
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tool-versions') }}-rust-unit-

      - name: Run mapper Rust unit tests
        run: cargo test -p mapper_ex
